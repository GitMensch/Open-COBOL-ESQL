name: Open-COBOL-ESQL tests

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-workflows:
    uses: ./.github/workflows/check-workflows.yml

  Open-COBOL-ESQL-tests:
    needs: check-workflows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ["ubuntu:24.04", "almalinux:9"]
    container:
      image: ${{ matrix.os }}

    # Start PostgreSQL server
    services:
      postgres:
        image: postgres:9.6
        # use default port relocation
        #ports: 
        #  - 5432:5432
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: main_user
          POSTGRES_DB: testdb
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # Install dependencies (Ubuntu 24.04)
      - name: Install dependencies on Ubuntu 24.04
        if: matrix.os == 'ubuntu:24.04'
        run: |
          apt update -y
          # Install dependencies of Open-COBOL-ESQL
          apt install -y build-essential bison flex gettext texinfo automake autoconf curl libtool libpq-dev pkgconf
          # Install dependencies of opensource COBOL
          apt install -y libgmp-dev

      # Install dependencies (Almalinux 9)
      - name: Install dependencies on AlmaLinux 9
        if: matrix.os == 'almalinux:9'
        run: |
          dnf -y update
          # Install dependencies of Open-COBOL-ESQL
          dnf install -y gcc gcc-c++ make bison flex automake autoconf diffutils gettext libtool postgresql-devel
          # Install dependencies of opensource COBOL
          dnf install -y gmp-devel

      # Cache the directory 'opensource-cobol-1.5.2J'
      - name: Cache opensource COBOL v1.5.2J
        id: opensource_cobol_cache_id
        uses: actions/cache@v5
        with:
          path: opensource-cobol-1.5.2J
          key: opensource-cobol-1.5.2J-key
          
      # Build opensource COBOL if the cache is not found
      #  (note: no INDEXED used, but vbisam built as configure does not allow disabling it)
      - name: Download and Build opensource COBOL v1.5.2J
        if: steps.opensource_cobol_cache_id.outputs.cache-hit != 'true'
        run: |
          # FIXME: release should have a release tarball (make dist) attached which we should download and use
          curl -L -o opensource-cobol-1.5.2J.tar.gz https://github.com/opensourcecobol/opensource-cobol/archive/refs/tags/v1.5.2J.tar.gz
          tar zxf opensource-cobol-1.5.2J.tar.gz
          # we need not only to configure but also install vbisam here to allow Open-Source-COBOL to find it...
          # FIXME: there is no other reason to install that than a broken --with-db, see
          #        https://github.com/opensourcecobol/opensource-cobol/issues/65
          cd opensource-cobol-1.5.2J/vbisam
          ./configure --prefix=/usr && make && make install && cd ..
          ./configure --prefix=/usr/ --with-vbisam
          make
      
      # Install opensource COBOL
      #  (note: no INDEXED used, but vbisam built as configure does not allow disabling it)
      - name: Install opensource COBOL v1.5.2J
        run: |
          cd opensource-cobol-1.5.2J/vbisam
          make install && cd ..
          make install

      # Checkout Open-COBOL-ESQL
      - name: Checkout Open-COBOL-ESQL
        uses: actions/checkout@v6
        with:
          path: Open-COBOL-ESQL

      # Build and Install Open-COBOL-ESQL
      - name: Install Open-COBOL-ESQL
        working-directory: Open-COBOL-ESQL
        run: |
          chmod +x ./autogen.sh && ./autogen.sh
          ./configure
          make install

      # Run tests Open Source COBOL
      - name: Run tests OSS
        working-directory: Open-COBOL-ESQL/tests
        run: |
          make clean
          cp ../.github/workflows/test-settings/* .
          make
          ./basic      || echo "warning: basic tests failed"
          ./cobol_data || echo "warning: cobol_data tests failed"
          ./sql_data   || echo "warning: sql_data tests failed"
          ./sqlca      || echo "warning: sqlca tests failed"
          ./misc       || echo "warning: misc tests failed"
          mkdir -p ../log/test_oss
          cp -r ./*.dir ./*.log ../log/test_oss
      
      # uninstall OSS COBOL
      - name: Uninstall Open-Source-COBOL
        run: |
          cd opensource-cobol-1.5.2J
          make uninstall

      # Install GnuCOBOL (Ubuntu 24.04)
      - name: Install GnuCOBOL on Ubuntu 24.04
        if: matrix.os == 'ubuntu:24.04'
        run: |
          apt install -y gnucobol

      # Install GnuCOBOL (Almalinux 9)
      - name: Install GnuCOBOL on AlmaLinux 9
        if: matrix.os == 'almalinux:9'
        run: |
          dnf install -y epel-release          
          dnf -y update
          dnf install -y gnucobol

      # Run tests GnuCOBOL
      - name: Run tests GNU
        working-directory: Open-COBOL-ESQL/tests
        run: |
          make clean
          cp ../.github/workflows/test-settings/* .
          make
          # sadly the Ubuntu package is broken... work around that
          type -t apt 1>/dev/null && COB_CFLAGS=$(cobc --info | awk '/^COB_CFLAGS/{sub(/.*: */,"");s=$0;f=1;next} f&&/^[ \t]/{sub(/^[ \t]+/,"");s=s" "$0;next} f{gsub(/-D_FORTIFY_SOURCE=2 /,"",s);print s;exit}' ) && export COB_CFLAGS
          ./basic      || echo "warning: basic tests failed"
          ./cobol_data || echo "warning: cobol_data tests failed"
          ./sql_data   || echo "warning: sql_data tests failed"
          ./sqlca      || echo "warning: sqlca tests failed"
          ./misc       || echo "warning: misc tests failed"
          mkdir -p ../log/test_gc
          cp -r ./*.dir ./*.log ../log/test_gc

      # Define the archive name
      - name: Define the archive name
        run: |
          echo "OCESQL_ARCHIVE_NAME=ocesql-${{ matrix.os }}" | sed s/:/-/g >> "$GITHUB_ENV"

      # Upload test logs and the result of static checking
      - name: Archive Logs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.OCESQL_ARCHIVE_NAME }}.log
          path: Open-COBOL-ESQL/log/*
      
      # Workflow fails if one or more test cases failed
      - name: Check test results
        working-directory: Open-COBOL-ESQL/log
        run: |
          echo result with Open Source COBOL
          cat test_oss/*.log
          echo result with GnuCOBOL
          cat test_gc/*.log
          ! cat test_*/*.log | grep -q 'Failed tests:'
